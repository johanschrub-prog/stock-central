<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Central</title>
    <!-- 1. Bibliothèques externes -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 2. Script de synchronisation Cloud (chargé en premier) -->
    <script src="sync.js"></script>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            margin: 0;
            background: #f5f6f8;
        }
        header {
            background: #1976d2;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background: white;
        }
        .tab {
            width: 48%;
            min-height: 60px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #ddd;
            white-space: normal;
        }
        .active {
            color: white;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: white;
            flex-wrap: wrap;
        }
        input {
            padding: 10px;
        }
        .cards {
            padding: 10px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,.15);
        }
        .valeur {
            color: #1976d2;
            font-weight: bold;
        }
        #blocOutils {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        #blocOutils button {
            width: 48%;
            min-height: 60px;
            font-size: 18px;
            font-weight: bold;
            margin: 1%;
            border: none;
            border-radius: 8px;
            background: #ddd;
            cursor: pointer;
        }
        #btnAccueil {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 50%;
            background: #1976d2;
            color: white;
            font-size: 24px;
        }
        .article-selectionne {
            background: #fff3cd !important;
            border: 3px solid #ff9800 !important;
            box-shadow: 0 0 10px rgba(255,152,0,.5);
        }
    </style>
</head>
<body>
<header>
    <h2>📦 STOCK CENTRAL</h2>
</header>
    <div id="statutCloud" style="font-size: 12px; color: #5c6672; background: #eef1f5; padding: 5px 12px; text-align: right; border-bottom: 1px solid #e1e5ea;">
    ☁️ Cloud : prêt
</div>
<div id="ongletsPrincipaux" class="tabs"></div>
<div id="sousOnglets" class="tabs"></div>
<div class="toolbar">
    <input type="file" id="importStock" accept=".json" style="display:none" onchange="importStock(event)">
    <div class="toolbar">
    <input type="file" id="importStock" accept=".json" style="display:none" onchange="importStock(event)">

    <button onclick="ouvrirStockFournisseur()" style="width:100%; min-height:56px; font-size:18px; font-weight:bold; background:#6f42c1; color:white; border:none; border-radius:8px; cursor:pointer;">
        🏭 Stock fournisseur
    </button>
    <button id="flecheOutils" onclick="toggleOutils()" style="width:100%; min-height:60px; font-size:20px; font-weight:bold;">
        ▶️ Outils
    </button>
    <div id="blocOutils" style="display:none; width:100%; margin-top:10px;">
        <button onclick="forcerSynchroCloud()" style="background: #1976d2; color: white;">
            🔄 Synchroniser maintenant
        </button>
        <button onclick="document.getElementById('importExcel').click()">📥 Import Inventaire</button>
        <button onclick="forcerEnvoiCloud()" style="background: #2e7d32; color: white;">
            📤 Sauvegarder & Envoyer sur le Cloud
        </button>
    </div>
    <div style="width:100%; display:flex; gap:10px; margin-top:10px;">
        <input id="search" list="listeProduits" placeholder="Recherche article ou code" onclick="this.select()" oninput="render()" style="flex:1;">
        
        <select id="filtreCave" onchange="render()" style="flex:1;">
            <option value="">Toutes les caves</option>
            <option value="HDLP MINI BAR">HDLP MINI BAR</option>
            <option value="HDLP SOFT">HDLP SOFT</option>
            <option value="HDLP BAR">HDLP BAR</option>
            <option value="HDLP SEMINAIRE">HDLP SEMINAIRE</option>
            <option value="RCLP ALCOOL">RCLP ALCOOL</option>
            <option value="RCLP SOFT">RCLP SOFT</option>
            <option value="RCLP VIN">RCLP VIN</option>
        </select>
        
        <input type="file" id="importExcel" accept=".xlsx" style="display:none" onchange="importerExcel(event)">
    </div>
    <div style="width:100%; display:flex; align-items:center; gap:8px; margin-top:6px;">
        <input type="checkbox" id="afficherZero" onchange="render()" style="width:20px; height:20px; cursor:pointer;">
        <label for="afficherZero" style="font-size:16px; font-weight:bold; cursor:pointer;">
            Afficher tous les articles (même stock à 0)
        </label>
    </div>
</div>
<div id="cards" class="cards"></div>
<button id="btnAccueil" onclick="location.href='https://johanschrub-prog.github.io/hotel-paix-hub/'">
    🏠
</button>
<div id="popupTransfert" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:9999;">
    <div style="background:white; margin:20px; padding:15px; border-radius:12px;">
        <h3>🔄 Transfert de stock</h3>
        <p id="articleTransfert"></p>
        <input id="quantiteTransfert" type="number" placeholder="Quantité" style="width:100%;margin-bottom:10px;">
        
        <select id="destinationTransfert" style="width:100%;padding:10px;">
            <option value="HDLP MINI BAR">HDLP MINI BAR</option>
            <option value="HDLP SOFT">HDLP SOFT</option>
            <option value="HDLP BAR">HDLP BAR</option>
            <option value="HDLP SEMINAIRE">HDLP SEMINAIRE</option>
            <option value="RCLP ALCOOL">RCLP ALCOOL</option>
            <option value="RCLP SOFT">RCLP SOFT</option>
            <option value="RCLP VIN">RCLP VIN</option>
        </select>
        
        <br><br>
        <button onclick="validerTransfert()">✅ Valider</button>
        <button onclick="fermerTransfert()">❌ Annuler</button>
    </div>
</div>
<!-- 3. Scripts fonctionnels de l'application -->
<script src="ventes.js"></script>
<script src="remontee-hdlp.js"></script>
<script src="remontee-rclp.js"></script>
<script src="commandes-hdlp.js"></script>
<script src="commandes-rclp.js"></script>
<script src="stats.js"></script>
<script src="fournisseurs.js"></script>
<script src="app.js"></script>
<!-- Script de gestion du menu Outils & Pont de secours mobile -->
<script>
let outilsOuverts = false;
function toggleOutils(){
    outilsOuverts = !outilsOuverts;
    document.getElementById("blocOutils").style.display = outilsOuverts ? "flex" : "none";
    document.getElementById("flecheOutils").innerHTML = outilsOuverts ? "🔽 Outils" : "▶️ Outils";
}
function forcerEnvoiManuel() {
    let payload = {};
    const cles = [
        "StockCentral", "Fournisseurs", "analyseOuverte", "boutiqueData", 
        "caveData", "miseCoupe", "mouvements", "remonteesEffectuees", 
        "commandesHDLP", "commandesRCLP"
    ];
    
    cles.forEach(cle => {
        const val = localStorage.getItem(cle);
        if (val !== null) {
            try { payload[cle] = JSON.parse(val); } catch(e){ payload[cle] = val; }
        }
    });
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "sauvegarde_s26.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    
    alert("✅ Fichier 'sauvegarde_s26.json' téléchargé sur votre téléphone !");
}
</script>
</body>
</html>
